version: '3.9'

networks:
  public:
    name: family_public
  internal:
    name: family_internal
    internal: true  # Kein Internetzugang für interne Services

volumes:
  postgres_data:
  redis_data:
  minio_data:
  traefik_certs:
  app_logs:

services:

  # ─── REVERSE PROXY ──────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: family_traefik
    restart: unless-stopped
    networks:
      - public
      - internal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/certs
      - ./infrastructure/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infrastructure/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    labels:
      - "traefik.enable=false"

  # ─── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
      target: production
    image: family-planner/api:${APP_VERSION:-latest}
    container_name: family_api
    restart: unless-stopped
    networks:
      - public
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=security-headers@file,api-ratelimit@file"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
      - "traefik.docker.network=family_public"

  # ─── ADMIN WEB ──────────────────────────────────────────────────────────────
  admin-web:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      target: production
    image: family-planner/admin-web:${APP_VERSION:-latest}
    container_name: family_admin
    restart: unless-stopped
    networks:
      - public
      - internal
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXT_PUBLIC_API_URL: "https://api.${DOMAIN}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.${DOMAIN}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.admin.middlewares=security-headers@file"
      - "traefik.http.services.admin.loadbalancer.server.port=3001"
      - "traefik.docker.network=family_public"

  # ─── WORKER (BullMQ Job-Processor) ──────────────────────────────────────────
  worker:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
      target: production
    image: family-planner/api:${APP_VERSION:-latest}
    container_name: family_worker
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_MODE: worker
    volumes:
      - app_logs:/app/logs
    command: ["node", "dist/main.worker"]

  # ─── SCHEDULER (Cron Jobs) ───────────────────────────────────────────────────
  scheduler:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
      target: production
    image: family-planner/api:${APP_VERSION:-latest}
    container_name: family_scheduler
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_MODE: scheduler
    volumes:
      - app_logs:/app/logs
    command: ["node", "dist/main.scheduler"]

  # ─── POSTGRESQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: family_postgres
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # KEIN Port-Mapping → niemals öffentlich erreichbar

  # ─── REDIS ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: family_redis
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/etc/redis/redis.conf:ro
    command: redis-server /etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # KEIN Port-Mapping

  # ─── MINIO (S3-kompatibel, selbst gehostet) ─────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: family_minio
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    # Zugriff auf MinIO-Console nur via SSH-Tunnel:
    # ssh -L 9001:localhost:9001 user@dein-vps.tld
    # Dann: http://localhost:9001

  # ─── UPTIME KUMA (Monitoring — optional) ────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: family_uptime
    restart: unless-stopped
    networks:
      - public
      - internal
    volumes:
      - ./infrastructure/uptime-kuma:/app/data
    profiles:
      - monitoring
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.status.rule=Host(`status.${DOMAIN}`)"
      - "traefik.http.routers.status.entrypoints=websecure"
      - "traefik.http.routers.status.tls.certresolver=letsencrypt"
      - "traefik.http.routers.status.middlewares=security-headers@file"
      - "traefik.http.services.status.loadbalancer.server.port=3001"
      - "traefik.docker.network=family_public"
