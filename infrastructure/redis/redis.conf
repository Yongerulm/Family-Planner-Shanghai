# Redis Production Configuration
# Family Planner Shanghai

# ─── Security ────────────────────────────────────────────────────────────────
requirepass CHANGE_THIS_REDIS_PASSWORD_IN_ENV
protected-mode yes
bind 0.0.0.0

# ─── Persistence (AOF - Append Only File) ───────────────────────────────────
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# RDB Snapshots als Backup
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# ─── Memory ──────────────────────────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# ─── Performance ─────────────────────────────────────────────────────────────
tcp-keepalive 300
timeout 0
tcp-backlog 511
hz 10
dynamic-hz yes
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no

# ─── Logging ─────────────────────────────────────────────────────────────────
loglevel notice
logfile ""

# ─── Slow Log ────────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000  # 10ms
slowlog-max-len 128

# ─── BullMQ Compatibility ────────────────────────────────────────────────────
# BullMQ benötigt keine speziellen Redis-Einstellungen,
# aber notify-keyspace-events für Keyspace-Notifications
notify-keyspace-events ""
